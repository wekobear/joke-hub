<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Vibrant Indigo to Violet Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="28%" stop-color="#4F46E5" />
      <stop offset="68%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Subtle inner rim for crisp vector edge definition -->
    <linearGradient id="bgRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>

    <!-- Jet Black Mascot Body Gradient -->
    <linearGradient id="blobGrad" x1="28%" y1="0%" x2="72%" y2="100%">
      <stop offset="0%" stop-color="#24242D" />
      <stop offset="35%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090C" />
    </linearGradient>

    <!-- Soft ambient top dome highlight -->
    <linearGradient id="blobHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Electric Cyan Tears of Joy Gradients -->
    <linearGradient id="tearGradL" x1="100%" y1="10%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="32%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="tearGradR" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="32%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Mascot Grounding Shadow -->
    <filter id="mascotShadow" x="-20%" y="-10%" width="140%" height="135%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#140628" flood-opacity="0.55" />
    </filter>

    <!-- Clip path for mouth interior -->
    <clipPath id="mouthClip">
      <path d="M 378, 565
               C 425, 590 599, 590 646, 565
               C 646, 565 620, 725 512, 725
               C 404, 725 378, 565 378, 565 Z" />
    </clipPath>
  </defs>

  <!-- Rounded Square Background (1024x1024, Squircle rx=224) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />
  <rect width="1024" height="1024" rx="224" fill="none" stroke="url(#bgRim)" stroke-width="4" />

  <!-- Mascot Blob Body -->
  <g filter="url(#mascotShadow)">
    <!-- Chubby cute round jet-black blob silhouette -->
    <path d="M 512, 230
             C 650, 230 750, 310 788, 440
             C 824, 560 812, 675 760, 745
             C 700, 808 595, 800 512, 800
             C 429, 800 324, 808 264, 745
             C 212, 675 200, 560 236, 440
             C 274, 310 374, 230 512, 230 Z"
          fill="url(#blobGrad)" />

    <!-- Top dome volume highlight -->
    <path d="M 512, 234
             C 645, 234 742, 312 779, 438
             C 798, 505 788, 590 740, 665
             C 680, 700 588, 705 512, 705
             C 436, 705 344, 700 284, 665
             C 236, 590 226, 505 245, 438
             C 282, 312 379, 234 512, 234 Z"
          fill="url(#blobHighlight)" />
  </g>

  <!-- Flying Tears of Joy (Left) -->
  <g>
    <!-- Main teardrop -->
    <path d="M 238, 430
             C 200, 380 130, 385 130, 440
             C 130, 485 190, 500 238, 430 Z"
          fill="url(#tearGradL)" />
    <!-- White specular gleam -->
    <circle cx="158" cy="435" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="180" cy="455" r="5" fill="#FFFFFF" opacity="0.75" />

    <!-- Splash droplets -->
    <circle cx="135" cy="360" r="18" fill="#38BDF8" />
    <circle cx="135" cy="360" r="6" fill="#FFFFFF" opacity="0.9" />
    <circle cx="185" cy="335" r="12" fill="#7DD3FC" />
  </g>

  <!-- Flying Tears of Joy (Right) -->
  <g>
    <!-- Main teardrop -->
    <path d="M 786, 430
             C 824, 380 894, 385 894, 440
             C 894, 485 834, 500 786, 430 Z"
          fill="url(#tearGradR)" />
    <!-- White specular gleam -->
    <circle cx="866" cy="435" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="844" cy="455" r="5" fill="#FFFFFF" opacity="0.75" />

    <!-- Splash droplets -->
    <circle cx="889" cy="360" r="18" fill="#38BDF8" />
    <circle cx="889" cy="360" r="6" fill="#FFFFFF" opacity="0.9" />
    <circle cx="839" cy="335" r="12" fill="#7DD3FC" />
  </g>

  <!-- Two White Capsule-Shaped Eyes (Tall rounded rectangles) -->
  <rect x="382" y="350" width="68" height="165" rx="34" fill="#FFFFFF" />
  <rect x="574" y="350" width="68" height="165" rx="34" fill="#FFFFFF" />

  <!-- Laughing Hysterically Open Mouth -->
  <g>
    <!-- Outer mouth border & deep dark plum cavity -->
    <path d="M 378, 565
             C 425, 590 599, 590 646, 565
             C 646, 565 620, 725 512, 725
             C 404, 725 378, 565 378, 565 Z"
          fill="#1C0F28" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Mouth contents (clipped to mouth shape) -->
    <g clip-path="url(#mouthClip)">
      <!-- Radiant coral-pink tongue -->
      <path d="M 430, 645
               C 465, 608 559, 608 594, 645
               C 570, 725 454, 725 430, 645 Z"
            fill="#FF3366" />
      <path d="M 454, 658
               C 475, 632 549, 632 570, 658
               C 555, 710 469, 710 454, 658 Z"
            fill="#FFA3B8" opacity="0.7" />

      <!-- Top white teeth bar -->
      <path d="M 395, 568
               C 445, 592 579, 592 629, 568
               L 620, 604
               C 570, 616 454, 616 404, 604 Z"
            fill="#FFFFFF" />
    </g>
  </g>
</svg>
